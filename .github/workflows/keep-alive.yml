name: TickRadar 24/7 Keep-Alive

on:
  schedule:
    # Runs every 10 minutes 24/7 to prevent Render cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TickRadar Health Endpoint
        run: |
          echo "Pinging TickRadar on Render..."
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 "https://tickradar.onrender.com/api/status/data-source" || echo "PING_SENT")
          echo "Ping result: $HTTP_STATUS"
          exit 0
